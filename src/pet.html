<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Snoopy</title>
  <link rel="stylesheet" href="shared/theme.css" />
  <link rel="stylesheet" href="pet.css" />
</head>
<body>
  <div id="stage">
    <div id="bubble" class="hidden"><span id="bubble-text"></span></div>

    <div id="toolbar">
      <button class="tool-btn" id="tool-focus" title="Start focus timer">▶</button>
      <button class="tool-btn" id="tool-todo" title="To-do list">
        ✓<span id="todo-badge" class="badge hidden">0</span>
      </button>
      <button class="tool-btn" id="tool-dash" title="Dashboard">🏠</button>
    </div>

    <img id="sprite" src="assets/gifs/normal.gif" alt="Snoopy" draggable="false" />
    <img id="sprite-overlay" src="" alt="" draggable="false" class="hidden" />

    <div id="pill" class="hidden">
      <span id="pill-label"></span><span id="pill-time"></span>
    </div>
  </div>

  <div id="ctx-menu" class="hidden">
    <button data-action="focus">Start Focus Timer</button>
    <button data-action="todo">To-Do List</button>
    <button data-action="settings">Settings</button>
    <button data-action="dashboard">Open Dashboard</button>
    <hr />
    <button data-action="hide">Hide Snoopy</button>
    <button data-action="quit">Quit</button>
  </div>

  <script type="module" src="pet.js"></script>
</body>
</html>
