name: Build Snoopy Companion (Windows)

# Builds a Windows installer without needing Rust installed on your own
# machine. Push this project to a GitHub repo, then go to the "Actions" tab
# on GitHub, select this workflow, and click "Run workflow". When it
# finishes (usually 5-10 minutes), open the run and download the
# "snoopy-companion-windows" artifact at the bottom of the page - unzip it
# and you'll have the installer .exe to send along.

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm install

      - name: Build the app
        run: npm run build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: snoopy-companion-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
